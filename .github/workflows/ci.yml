name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - run: python evals/run_eval.py
      - run: python scripts/demo_review.py --reset
      - name: Check for committed secrets
        run: |
          ! grep -RInE "(ghp_|gho_|AKIA[0-9A-Z]{16}|sk-live-[A-Za-z0-9]{16,})" --exclude-dir=node_modules --exclude-dir=.git . || (echo "possible secret in repo" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm run build
